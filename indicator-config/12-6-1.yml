data_footnote: |
  Notes:
  1. This indicator shows the number of entities that submitted an Environmental, Social and Governance (ESG) Report on the dedicated ESG Platform.
  2. The ESG Platform was launched in December 2021 by the Ministry for Energy, the Environment, and the Regeneration of the Grand Harbour as a voluntary tool, designed to showcase and instil education and awareness on environmental, social and governance credentials.
  3. The above figures reflect the number of reports submitted during a particular year, which contain information on the previous financial year.
