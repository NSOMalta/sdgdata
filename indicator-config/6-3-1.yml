      Note: The values for this indicator have been revised downwards because the denominator has been changed from the wastewater generated by households and businesses to the total wastewater generation, inclusive of stormwater and seawater infiltration. This change has been effected since the numerator (wastewater input into treatment) includes stormwater and seawater infiltration as well.
      
      Source: National Statistics Office (NSO) Malta
