  - series: 2. Trust in the institutions
    value: |
      Notes:
      1. This indicator shows the percentage of people who tend to trust the European Union / the Maltese Parliament / the Maltese Government.
      2. This data is retrieved from the Standard Eurobarometer, which is a long-running public opinion survey program conducted on behalf of the European Commission.
      
      Source: European Commission
  - series: 1. Average rating scores on government services given by the public
    value: |
      Notes:
      1. The above data has been provided by the People & Standards Division of the Office of the Prime Minister.
      2. The data is gathered through Survey Kiosks located in several client-facing departments or offices, where the public is invited to rate the service received using a smiling, neutral or frowning emoji.

      Source: Office of the Prime Minister (OPM)
